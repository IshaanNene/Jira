# Local development dependencies. Services and the web app run on the host (`make dev`).
# Host ports are deliberately non-default so they never collide with locally installed
# PostgreSQL/Redis. Later phases add Kafka, OpenSearch, ClickHouse and MinIO under profiles.
name: platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports: ["127.0.0.1:54320:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:63790:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for attachments (SeaweedFS). Production uses a managed
  # S3-compatible service; only the endpoint and credentials differ.
  object-storage:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=20", "-master.volumeSizeLimitMB=256"]
    ports: ["127.0.0.1:58333:8333"]
    volumes:
      - object-data:/data
      - ./infrastructure/object-storage/s3.dev.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 3s
      timeout: 3s
      retries: 40

  # One-shot: create the attachments bucket.
  object-storage-setup:
    image: chrislusf/seaweedfs:latest
    depends_on:
      object-storage: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c", "echo 's3.bucket.create -name attachments' | weed shell -master=object-storage:9333"]
    restart: "no"

  gateway:
    image: envoyproxy/envoy:v1.33-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9901:9901"
    volumes:
      - ./infrastructure/envoy/envoy.dev.yaml:/etc/envoy/envoy.yaml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080'"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  object-data:
