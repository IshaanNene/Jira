syntax = "proto3";
package platform.user.v1;

service Membership {
  // Used by identity-service before it signs an organization-scoped token.
  rpc CheckMembership(CheckMembershipRequest) returns (CheckMembershipResponse);
  // Role, status and name of the given people in one workspace (notification-service).
  // People who are not members are left out of the reply.
  rpc GetMembers(GetMembersRequest) returns (Members);
  // Members whose email or display name equals one of the terms, ignoring case
  // (search-service resolves people named in a query).
  rpc FindMembers(FindMembersRequest) returns (Members);
}

message CheckMembershipRequest {
  string user_id = 1;
  string organization_id = 2;
}

message CheckMembershipResponse {
  bool is_member = 1;
  string tenant_id = 2;
  string org_role = 3; // owner | admin | member | guest
  string status = 4;   // active | suspended
}

message GetMembersRequest {
  string tenant_id = 1;
  repeated string user_ids = 2; // at most 500
}

message Member {
  string user_id = 1;
  string org_role = 2;
  string status = 3;
  string display_name = 4;
  string email = 5; // for notification email; never shown to other users by callers
}

message Members {
  repeated Member members = 1;
}

message FindMembersRequest {
  string tenant_id = 1;
  repeated string terms = 2; // at most 100, each at most 200 characters
}
