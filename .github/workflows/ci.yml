# Continuous integration: every push and pull request is formatted, linted, tested and built.
# On main, images are pushed to GHCR and tagged with the commit; deployment picks them up by
# digest (docs/DEPLOYMENT_GUIDE.md §4).
name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # libcurl headers: librdkafka 2.12 includes curl.h even with curl turned off (its config.h
      # always defines WITH_OAUTHBEARER_OIDC); nothing links against curl. OpenSSL, libxml2 and
      # xmlsec1 (with libclang for bindgen): identity-service checks SAML signatures with xmlsec1.
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler cmake libcurl4-openssl-dev \
            pkg-config libssl-dev libclang-dev libxml2-dev libxmlsec1-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Data stores
        # The same containers as local development (docker-compose.yml), without the gateway.
        run: |
          docker compose up -d --wait postgres redis object-storage kafka opensearch clickhouse mailpit
          docker compose up -d object-storage-setup
          docker compose run --rm kafka-setup > /dev/null
      - name: Test
        run: |
          set -a; . ./.env.example; set +a
          cargo test --workspace --locked
      - name: Data store logs
        if: failure()
        run: docker compose logs --tail 200

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check advisories }

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.23.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s lint
      - run: pnpm exec tsc --noEmit -p .
      - run: pnpm exec vitest run
      - run: pnpm build

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - name: Lint
        run: |
          helm lint infrastructure/helm/meridian --set image.tag=ci
          helm lint infrastructure/helm/meridian -f infrastructure/helm/meridian/values-kind.yaml
          helm lint infrastructure/helm/meridian -f infrastructure/helm/meridian/values-staging.yaml
      - name: Rendered manifests match the Kubernetes and CRD schemas
        # Strict: unknown fields and repeated keys fail. CRDs (ExternalSecret, ScaledObject,
        # Argo CD) are checked against the community CRD catalog.
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          check() { ./kubeconform -strict -summary -kubernetes-version 1.31.0 -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' "$@"; }
          helm template ci infrastructure/helm/meridian --set image.tag=ci | check -
          helm template ci infrastructure/helm/meridian -f infrastructure/helm/meridian/values-kind.yaml | check -
          helm template ci infrastructure/helm/meridian -f infrastructure/helm/meridian/values-staging.yaml | check -
          check infrastructure/argocd/platform.yaml infrastructure/argocd/staging.yaml infrastructure/argocd/secret-store/
      - name: Alert rules are valid and their tests pass
        run: |
          docker run --rm -v "$PWD/infrastructure/observability/prometheus:/w:ro" -w /w --entrypoint promtool prom/prometheus:v3.0.1 check rules alerts.yml slo.yml
          docker run --rm -v "$PWD/infrastructure/observability/prometheus:/w:ro" -w /w --entrypoint promtool prom/prometheus:v3.0.1 test rules slo.test.yml
      - name: Gateway configuration is valid Envoy
        run: |
          helm template ci infrastructure/helm/meridian --set image.tag=ci --show-only templates/gateway.yaml \
            | yq 'select(.kind == "ConfigMap") | .data["envoy.yaml"]' > envoy.yaml
          docker run --rm -v "$PWD/envoy.yaml:/envoy.yaml:ro" envoyproxy/envoy:v1.33.2 --mode validate -c /envoy.yaml

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: { run: { working-directory: infrastructure/terraform/environments/staging } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.5 }
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  images:
    needs: [rust, web, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign proves this workflow built the image with GitHub's OIDC token.
      id-token: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      PREFIX: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # No setup-buildx: the engine's own builder keeps the images in the engine's store. With a
      # separate buildx container builder the images are exported into the engine, and pushing
      # those to GHCR failed with "unknown blob".
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build
        # One builder for every image, so the Rust workspace compiles once.
        run: |
          PREFIX="$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')"
          scripts/images/build.sh "${GITHUB_SHA::12}" "$PREFIX"
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"
      - name: Scan
        # Fails on fixable high and critical vulnerabilities in any image.
        run: |
          for image in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep "^$PREFIX/.*:${GITHUB_SHA::12}$"); do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - name: Push
        if: env.PUSH == 'true'
        # Retries: GHCR sometimes rejects the manifest with "unknown blob" just after mounting a
        # shared layer from another repository; a second push finds every layer and succeeds.
        run: |
          for image in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep "^$PREFIX/.*:${GITHUB_SHA::12}$"); do
            for attempt in 1 2 3 4; do
              docker push -q "$image" && break
              [ "$attempt" = 4 ] && exit 1
              echo "push of $image failed (attempt $attempt); retrying"; sleep $((attempt * 10))
            done
          done
      - uses: sigstore/cosign-installer@v3.7.0
        if: env.PUSH == 'true'
      - name: SBOM, sign and attest
        if: env.PUSH == 'true'
        # Each pushed image gets a CycloneDX SBOM, a keyless signature and the SBOM as a signed
        # attestation, all bound to the image digest (tags can move; digests cannot). Verified
        # straight after, as a deployment would.
        run: |
          mkdir -p sbom
          identity="^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@refs/heads/main$"
          issuer=https://token.actions.githubusercontent.com
          for image in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep "^$PREFIX/.*:${GITHUB_SHA::12}$"); do
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            name=$(basename "${image%:*}")
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" aquasec/trivy:0.57.1 image \
              --format cyclonedx --output "/out/$name.cdx.json" --no-progress "$image"
            cosign sign --yes "$digest"
            cosign attest --yes --type cyclonedx --predicate "sbom/$name.cdx.json" "$digest"
            cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$digest" > /dev/null
            cosign verify-attestation --type cyclonedx --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$digest" > /dev/null
            echo "$digest signed, SBOM attested"
          done
      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with: { name: sbom, path: sbom/, retention-days: 30 }
