# promtool test rules slo.test.yml — checks the SLO alerts in slo.yml fire when they should,
# and stay quiet when they should.
rule_files: [slo.yml]
evaluation_interval: 1m

tests:
  # issue-service fails 2 % of 1,000 requests a minute: 40× the availability budget.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="issue",route="/api/v1/issues",method="GET",status="200"}'
        values: '0+980x120'
      - series: 'http_requests_total{service="issue",route="/api/v1/issues",method="GET",status="503"}'
        values: '0+20x120'
    alert_rule_test:
      # Pages within minutes on the fast window…
      - eval_time: 10m
        alertname: AvailabilityBudgetBurningFast
        exp_alerts:
          - exp_labels: { service: issue, severity: page, slo: availability }
            exp_annotations:
              summary: "issue is failing requests fast enough to spend 2 % of its monthly error budget in an hour"
      # …before the six-hour alert has held for its 15 minutes.
      - eval_time: 10m
        alertname: AvailabilityBudgetBurning
        exp_alerts: []
      - eval_time: 30m
        alertname: AvailabilityBudgetBurning
        exp_alerts:
          - exp_labels: { service: issue, severity: page, slo: availability }
            exp_annotations:
              summary: "issue has spent 5 % of its monthly error budget in six hours"

  # project-service fails 1 in 10,000 (within budget); tenant-service gets one request every
  # two minutes, half of them failing: too little traffic to page on, but a ticket after an hour.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="project",route="/api/v1/projects",method="GET",status="200"}'
        values: '0+9999x120'
      - series: 'http_requests_total{service="project",route="/api/v1/projects",method="GET",status="500"}'
        values: '0+1x120'
      - series: 'http_requests_total{service="tenant",route="/x",method="GET",status="200"}'
        values: '0+0.25x120'
      - series: 'http_requests_total{service="tenant",route="/x",method="GET",status="500"}'
        values: '0+0.25x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: AvailabilityBudgetBurningFast
        exp_alerts: []
      - eval_time: 90m
        alertname: AvailabilityBudgetBurning
        exp_alerts: []
      - eval_time: 90m
        alertname: AvailabilityBudgetAtRisk
        exp_alerts:
          - exp_labels: { service: tenant, severity: ticket, slo: availability }
            exp_annotations:
              summary: "tenant is on course to miss its 99.95 % availability objective"

  # agile-service answers 30 % of requests in over 500 ms; its realtime-style stream route is
  # slow by design and does not count.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{service="agile",route="/api/v1/boards",method="GET",status="200",le="0.5"}'
        values: '0+700x120'
      - series: 'http_request_duration_seconds_bucket{service="agile",route="/api/v1/boards",method="GET",status="200",le="+Inf"}'
        values: '0+1000x120'
      - series: 'http_request_duration_seconds_count{service="agile",route="/api/v1/boards",method="GET",status="200"}'
        values: '0+1000x120'
      - series: 'http_requests_total{service="agile",route="/api/v1/boards",method="GET",status="200"}'
        values: '0+1000x120'
      - series: 'http_request_duration_seconds_bucket{service="realtime",route="/rt/stream",method="GET",status="200",le="0.5"}'
        values: '0x120'
      - series: 'http_request_duration_seconds_count{service="realtime",route="/rt/stream",method="GET",status="200"}'
        values: '0+100x120'
      - series: 'http_requests_total{service="realtime",route="/rt/stream",method="GET",status="200"}'
        values: '0+100x120'
    alert_rule_test:
      - eval_time: 10m
        alertname: LatencyBudgetBurningFast
        exp_alerts:
          - exp_labels: { service: agile, severity: page, slo: latency }
            exp_annotations:
              summary: "agile: so many requests take over 500 ms that 2 % of the monthly latency budget goes in an hour"
      - eval_time: 10m
        alertname: AvailabilityBudgetBurningFast
        exp_alerts: []
