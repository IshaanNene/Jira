# Local Prometheus. In Kubernetes the same jobs come from pod annotations
# (prometheus.io/scrape, port, path) set by the Helm chart.
global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml, /etc/prometheus/slo.yml]

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8101
          - host.docker.internal:8102
          - host.docker.internal:8103
          - host.docker.internal:8104
          - host.docker.internal:8105
          - host.docker.internal:8106
          - host.docker.internal:8107
          - host.docker.internal:8108
          - host.docker.internal:8109
          - host.docker.internal:8110
          - host.docker.internal:8111
          - host.docker.internal:8113
  - job_name: gateway
    metrics_path: /stats/prometheus
    static_configs:
      - targets: [gateway:9901]
