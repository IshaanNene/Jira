# Cluster add-ons the Meridian chart relies on. Pinned chart versions; upgrades are commits.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.7
    helm:
      valuesObject:
        installCRDs: true
        # EKS Pod Identity associates this service account with the role that may read
        # meridian-staging/* in Secrets Manager.
        serviceAccount: { name: external-secrets }
  destination: { server: "https://kubernetes.default.svc", namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.16.0
  destination: { server: "https://kubernetes.default.svc", namespace: keda }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Canary releases: the chart's services are Rollouts with rollouts.enabled.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.38.0
    helm:
      valuesObject:
        installCRDs: true
        dashboard: { enabled: false }
  destination: { server: "https://kubernetes.default.svc", namespace: argo-rollouts }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Admission policies: the chart's imageVerification Policy admits only images CI signed.
# Fails closed for the namespaces it has policies for; three replicas so one lost node does
# not stop pods from starting.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.3.4
    helm:
      valuesObject:
        admissionController: { replicas: 3 }
  destination: { server: "https://kubernetes.default.svc", namespace: kyverno }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Where ExternalSecrets read from. Credentials come from the controller's Pod Identity.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  annotations:
    # After the operator's CRDs exist.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/IshaanNene/Jira.git
    targetRevision: main
    path: infrastructure/argocd/secret-store
  destination: { server: "https://kubernetes.default.svc" }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
