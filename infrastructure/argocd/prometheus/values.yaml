# GENERATED by scripts/prometheus-values.sh from infrastructure/observability/prometheus; do not edit.
#
# Prometheus for the cluster (chart prometheus-community/prometheus), in the `observability`
# namespace the Meridian chart's NetworkPolicies let scrape. Its jobs carry the same names as the
# local Compose setup (`services`, `gateway`), so the alert and SLO rules apply unchanged, and
# label samples with the pod name, which the canary checks (templates/rollouts.yaml) select on.
server:
  retention: 15d
  persistentVolume: { size: 20Gi }
prometheus-pushgateway: { enabled: false }
serverFiles:
  prometheus.yml:
    rule_files: [/etc/config/recording_rules.yml, /etc/config/alerting_rules.yml]
    scrape_configs:
      - job_name: prometheus
        static_configs: [{ targets: ["localhost:9090"] }]
      - job_name: services
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [meridian] } }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep }
          - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], regex: gateway, action: drop }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], regex: (.+), target_label: __metrics_path__ }
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
          - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], target_label: app }
      - job_name: gateway
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [meridian] } }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep }
          - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], regex: gateway, action: keep }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], regex: (.+), target_label: __metrics_path__ }
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
  alerting_rules.yml:
    # Alerts on the service-level signals. Thresholds follow the targets in docs/SYSTEM_DESIGN.md
    # (p95 200 ms reads / 300 ms writes, 99.95 % availability).
    groups:
      - name: meridian
        rules:
          - alert: ServiceDown
            expr: up{job="services"} == 0
            for: 2m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.instance }} is not answering /metrics"

          - alert: HighErrorRate
            expr: |
              sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
                / sum by (service) (rate(http_requests_total[5m])) > 0.02
            for: 5m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.service }}: more than 2 % of requests fail"

          - alert: SlowRequests
            expr: |
              histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{route!~".*/rt/.*"}[5m]))) > 0.3
            for: 10m
            labels: { severity: ticket }
            annotations:
              summary: "{{ $labels.service }}: p95 latency above 300 ms"

          - alert: ConsumerWaitingOnDependency
            # A consumer retries a transient failure until it succeeds; this fires when it has
            # been stuck for a while (its data store is down, or a "transient" error is not).
            expr: rate(events_retried_total[5m]) > 0
            for: 10m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.consumer }} has been retrying an event for over 10 minutes"

          - alert: EventsDeadLettered
            expr: increase(events_dead_lettered_total[10m]) > 0
            labels: { severity: ticket }
            annotations:
              summary: "{{ $labels.consumer }} sent events to a dead-letter topic"

          - alert: OutboxPublishFailing
            expr: increase(outbox_failed_total[5m]) > 0
            for: 10m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.service }} cannot publish its outbox (Kafka unreachable?)"

          - alert: EmailsFailing
            expr: increase(notification_emails_total{outcome="failed"}[15m]) > 5
            labels: { severity: ticket }
            annotations:
              summary: "Notification emails are failing"
  recording_rules.yml:
    # Service-level objectives, per service, alerted on by how fast each spends its error budget
    # (multi-window, multi-burn-rate alerts as in the Google SRE workbook, chapter 5).
    #
    #   Availability: 99.95 % of requests over 30 days answer without a 5xx (budget 0.05 %).
    #   Latency:      99 % of requests over 30 days answer within 500 ms (budget 1 %). Realtime
    #                 streams (/rt/) are excluded: they stay open by design.
    #
    # A burn rate of 1 spends the whole budget in exactly 30 days. Each alert needs the long
    # window (is it significant?) and the short one (is it still happening?) over the threshold:
    #   14.4× over 1 h and 5 m  → 2 % of the month's budget gone in an hour        → page
    #    6×   over 6 h and 30 m → 5 % gone in six hours                            → page
    #    1×   over 3 d and 6 h  → on course to spend all of it                     → ticket
    # Services under about one request every 20 seconds are not paged on: there, a handful of
    # failed requests is a large ratio and says little. Tests: slo.test.yml (promtool test rules).
    groups:
      - name: slo-recording
        rules:
          # Requests per second, for the traffic floor.
          - record: service:http_requests:rate1h
            expr: sum by (service) (rate(http_requests_total[1h]))
          # Share of requests that failed (5xx), over each window an alert uses.
          - record: service:http_errors:ratio_rate5m
            expr: sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (service) (rate(http_requests_total[5m]))
          - record: service:http_errors:ratio_rate30m
            expr: sum by (service) (rate(http_requests_total{status=~"5.."}[30m])) / sum by (service) (rate(http_requests_total[30m]))
          - record: service:http_errors:ratio_rate1h
            expr: sum by (service) (rate(http_requests_total{status=~"5.."}[1h])) / sum by (service) (rate(http_requests_total[1h]))
          - record: service:http_errors:ratio_rate6h
            expr: sum by (service) (rate(http_requests_total{status=~"5.."}[6h])) / sum by (service) (rate(http_requests_total[6h]))
          - record: service:http_errors:ratio_rate3d
            expr: sum by (service) (rate(http_requests_total{status=~"5.."}[3d])) / sum by (service) (rate(http_requests_total[3d]))
          # Share of requests slower than 500 ms, over the same windows.
          - record: service:http_slow:ratio_rate5m
            expr: |
              1 - sum by (service) (rate(http_request_duration_seconds_bucket{le="0.5", route!~".*/rt/.*"}[5m]))
                / sum by (service) (rate(http_request_duration_seconds_count{route!~".*/rt/.*"}[5m]))
          - record: service:http_slow:ratio_rate30m
            expr: |
              1 - sum by (service) (rate(http_request_duration_seconds_bucket{le="0.5", route!~".*/rt/.*"}[30m]))
                / sum by (service) (rate(http_request_duration_seconds_count{route!~".*/rt/.*"}[30m]))
          - record: service:http_slow:ratio_rate1h
            expr: |
              1 - sum by (service) (rate(http_request_duration_seconds_bucket{le="0.5", route!~".*/rt/.*"}[1h]))
                / sum by (service) (rate(http_request_duration_seconds_count{route!~".*/rt/.*"}[1h]))
          - record: service:http_slow:ratio_rate6h
            expr: |
              1 - sum by (service) (rate(http_request_duration_seconds_bucket{le="0.5", route!~".*/rt/.*"}[6h]))
                / sum by (service) (rate(http_request_duration_seconds_count{route!~".*/rt/.*"}[6h]))
          - record: service:http_slow:ratio_rate3d
            expr: |
              1 - sum by (service) (rate(http_request_duration_seconds_bucket{le="0.5", route!~".*/rt/.*"}[3d]))
                / sum by (service) (rate(http_request_duration_seconds_count{route!~".*/rt/.*"}[3d]))

      - name: slo-alerts
        rules:
          - alert: AvailabilityBudgetBurningFast
            expr: |
              service:http_errors:ratio_rate1h > (14.4 * 0.0005) and service:http_errors:ratio_rate5m > (14.4 * 0.0005)
                and service:http_requests:rate1h > 0.05
            for: 2m
            labels: { severity: page, slo: availability }
            annotations:
              summary: "{{ $labels.service }} is failing requests fast enough to spend 2 % of its monthly error budget in an hour"
          - alert: AvailabilityBudgetBurning
            expr: |
              service:http_errors:ratio_rate6h > (6 * 0.0005) and service:http_errors:ratio_rate30m > (6 * 0.0005)
                and service:http_requests:rate1h > 0.05
            for: 15m
            labels: { severity: page, slo: availability }
            annotations:
              summary: "{{ $labels.service }} has spent 5 % of its monthly error budget in six hours"
          - alert: AvailabilityBudgetAtRisk
            expr: service:http_errors:ratio_rate3d > 0.0005 and service:http_errors:ratio_rate6h > 0.0005
            for: 1h
            labels: { severity: ticket, slo: availability }
            annotations:
              summary: "{{ $labels.service }} is on course to miss its 99.95 % availability objective"

          - alert: LatencyBudgetBurningFast
            expr: |
              service:http_slow:ratio_rate1h > (14.4 * 0.01) and service:http_slow:ratio_rate5m > (14.4 * 0.01)
                and service:http_requests:rate1h > 0.05
            for: 2m
            labels: { severity: page, slo: latency }
            annotations:
              summary: "{{ $labels.service }}: so many requests take over 500 ms that 2 % of the monthly latency budget goes in an hour"
          - alert: LatencyBudgetBurning
            expr: |
              service:http_slow:ratio_rate6h > (6 * 0.01) and service:http_slow:ratio_rate30m > (6 * 0.01)
                and service:http_requests:rate1h > 0.05
            for: 15m
            labels: { severity: page, slo: latency }
            annotations:
              summary: "{{ $labels.service }} has spent 5 % of its monthly latency budget in six hours"
          - alert: LatencyBudgetAtRisk
            expr: service:http_slow:ratio_rate3d > 0.01 and service:http_slow:ratio_rate6h > 0.01
            for: 1h
            labels: { severity: ticket, slo: latency }
            annotations:
              summary: "{{ $labels.service }} is on course to miss its objective of 99 % of requests within 500 ms"
