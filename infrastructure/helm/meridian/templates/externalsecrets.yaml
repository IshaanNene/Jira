{{- /*
The Secrets the chart expects (see values.yaml), filled by the External Secrets Operator from a
ClusterSecretStore, usually AWS Secrets Manager. Each Kubernetes Secret <name> comes from the
store entry <prefix>/<name>, a JSON object whose keys become the Secret's keys.

They are pre-install / pre-upgrade hooks that run before the migration Jobs (weight -10), so the
Jobs' credentials exist on the first install too; under Argo CD these are PreSync resources.
A Job that starts before its Secret is written retries until it is there. The Secrets are
orphaned rather than owned, so recreating the hook never removes them from running pods.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $root := . -}}
{{- $es := .Values.externalSecrets -}}
{{- $names := list "meridian-shared" -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.database }}
{{- $names = append $names (printf "meridian-%s" $name) }}
{{- if $root.Values.migrations.enabled }}
{{- $names = append $names (printf "meridian-%s-migrate" $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $names }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ . }}
  labels: {{- include "meridian.labels" $root | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ required "externalSecrets.storeName is required" $es.storeName }} }
  target: { name: {{ . }}, creationPolicy: Orphan }
  dataFrom:
    - extract: { key: {{ printf "%s/%s" (required "externalSecrets.prefix is required" $es.prefix) . }} }
{{- end }}
{{- end }}
