# Three-node cluster with zone labels, so topology spread and disruption budgets behave as
# they would across availability zones.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meridian
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8088, listenAddress: 127.0.0.1 }
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-a }
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-b }
